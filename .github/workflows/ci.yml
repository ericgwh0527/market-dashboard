name: Tests

on:
  push:
    branches: [main]
    paths: ["dashboard/**", "scripts/**", "tests/**", "config.json", ".github/workflows/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-dev.lock
      - run: pip install --require-hashes -r scripts/requirements-dev.lock
      - run: python -m pytest -q
      - name: config.json is valid
        run: python -c "from pathlib import Path; from dashboard.config import load_settings; s = load_settings(Path('config.json')); print(len(s.indices), 'indices,', len(s.stocks), 'stocks')"
      - name: No secrets or real holdings committed
        run: |
          ! git ls-files | grep -E '(^|/)holdings\.json$'
          ! git grep -nE 'AIza[0-9A-Za-z_-]{30,}|AQ\.Ab[0-9A-Za-z_-]{20,}|github_pat_[0-9A-Za-z_]{20,}|ghp_[0-9A-Za-z]{30,}' -- ':!docs/data'
