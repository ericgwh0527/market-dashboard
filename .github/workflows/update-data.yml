name: Update market data

on:
  schedule:
    - cron: "35 9 * * 1-5"    # 17:35 MYT – after Bursa Malaysia closes
    - cron: "40 21 * * 1-5"   # 05:40 MYT (next day) – after the US market closes
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["config.json", "dashboard/**", "scripts/**", ".github/workflows/update-data.yml"]

# Security notes (this repo and its Actions logs are PUBLIC):
# * Default token is read-only; only the job that commits data gets contents:write.
# * Actions are pinned to full commit SHAs, and Python packages to exact versions
#   with hashes, so a hijacked tag or package release can't run code here.
# * The checkout does not leave the write token in .git/config
#   (persist-credentials: false), so third-party code (yfinance, pandas…)
#   running in earlier steps can't read it. The token is only used in the commit step.
# * Each secret is given only to the step that needs it.
permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      HAS_PRIVATE: ${{ secrets.PRIVATE_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - run: pip install --require-hashes -r scripts/requirements.lock

      - name: Fetch prices, indicators, news (+ optional Gemini brief)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SESSION: ${{ github.event.schedule == '35 9 * * 1-5' && 'after-bursa' || (github.event.schedule == '40 21 * * 1-5' && 'after-us' || '') }}
        run: python scripts/fetch_data.py

      # ---- private holdings: read-only checkout, encrypted output, plaintext never committed
      - name: Check out private holdings repo
        if: env.HAS_PRIVATE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/market-dashboard-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private
          persist-credentials: false

      - name: Build encrypted portfolio
        if: env.HAS_PRIVATE == 'true'
        env:
          HOLDINGS_FILE: .private/holdings.json
          HOLDINGS_PASSPHRASE: ${{ secrets.HOLDINGS_PASSPHRASE }}
        run: python scripts/build_portfolio.py

      - name: Remove private checkout
        if: always()
        run: rm -rf .private

      - name: Commit data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Belt and braces: never commit anything outside docs/data, and never plaintext holdings.
          git add docs/data
          if git diff --cached --name-only | grep -Ev '^docs/data/' ; then echo "Refusing: unexpected paths staged"; exit 1; fi
          if git diff --cached --name-only | grep -qi 'holdings'; then echo "Refusing: holdings file staged"; exit 1; fi
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="market-data-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "data: $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d %H:%M MYT')"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth" pull --rebase --autostash
          git -c http.https://github.com/.extraheader="$auth" push
