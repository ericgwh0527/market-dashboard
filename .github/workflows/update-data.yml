name: Update market data

on:
  schedule:
    - cron: "45 4 * * 1-5"    # 12:45 MYT – Bursa lunch break (morning-session snapshot, no AI)
    - cron: "35 9 * * 1-5"    # 17:35 MYT – after Bursa Malaysia closes
    - cron: "40 21 * * 1-5"   # 05:40 MYT (next day) – after the US market closes
  workflow_dispatch:          # "Run workflow" button (only the repo owner can use it)
    inputs:
      ai_brief:
        description: "Also refresh the AI brief (skipped if one was made in the last hour)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["config.json", "dashboard/**", "scripts/**", ".github/workflows/update-data.yml"]

# Security notes (this repo and its Actions logs are PUBLIC):
# * Default token is read-only; each job that commits gets contents:write.
# * Actions are pinned to commit SHAs, Python packages to exact versions + hashes.
# * The write token is never left in .git/config (persist-credentials: false);
#   it is only handed to git in the final commit step.
# * Two separate jobs = two separate VMs:
#     market     – public data; runs yfinance/pandas/etc.; only sees GEMINI_API_KEY
#     portfolio  – private holdings; installs ONLY `cryptography`; only sees the
#                  read-only holdings token and the passphrase
#   so no third-party market-data package ever runs next to the passphrase.
permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main                    # latest data, not the commit that triggered the run
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - run: pip install --require-hashes -r scripts/requirements.lock

      - name: Fetch prices, indicators, news (+ optional Gemini brief)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SESSION: ${{ github.event.schedule == '35 9 * * 1-5' && 'after-bursa' || (github.event.schedule == '40 21 * * 1-5' && 'after-us' || (github.event.schedule == '45 4 * * 1-5' && 'midday' || '')) }}
          # AI brief: only after each close (auto), or on request (force); 1-hour cooldown either way
          AI_MODE: ${{ (github.event_name == 'schedule' && github.event.schedule != '45 4 * * 1-5') && 'auto' || (inputs.ai_brief && 'force' || 'off') }}
        run: python scripts/fetch_data.py

      - name: Commit data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/commit_data.sh "data"

  portfolio:
    needs: market
    if: always()                       # still value the portfolio if market data failed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      HAS_PRIVATE: ${{ secrets.PRIVATE_REPO_TOKEN != '' && secrets.HOLDINGS_PASSPHRASE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.HAS_PRIVATE == 'true'
        with:
          ref: main                    # pick up the market job's fresh commit
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.HAS_PRIVATE == 'true'
        with:
          python-version: "3.12"

      - name: Install cryptography only
        if: env.HAS_PRIVATE == 'true'
        run: pip install --require-hashes -r scripts/requirements-portfolio.lock

      - name: Check out private holdings repo
        if: env.HAS_PRIVATE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/market-dashboard-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private
          persist-credentials: false

      - name: Build encrypted portfolio
        if: env.HAS_PRIVATE == 'true'
        env:
          HOLDINGS_FILE: .private/holdings.json
          HOLDINGS_PASSPHRASE: ${{ secrets.HOLDINGS_PASSPHRASE }}
        run: python scripts/build_portfolio.py

      - name: Remove private checkout
        if: always()
        run: rm -rf .private

      - name: Commit encrypted portfolio
        if: env.HAS_PRIVATE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/commit_data.sh "portfolio"
