name: Update market data

on:
  schedule:
    - cron: "35 9 * * 1-5"    # 17:35 MYT – after Bursa Malaysia closes
    - cron: "40 21 * * 1-5"   # 05:40 MYT (next day) – after the US market closes
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["config.json", "scripts/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_PRIVATE: ${{ secrets.PRIVATE_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch prices, indicators, news (+ optional Gemini brief)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SESSION: ${{ github.event.schedule == '35 9 * * 1-5' && 'after-bursa' || (github.event.schedule == '40 21 * * 1-5' && 'after-us' || '') }}
        run: python scripts/fetch_data.py

      # ---- private holdings: read-only checkout, encrypted output, plaintext never committed
      - name: Check out private holdings repo
        if: env.HAS_PRIVATE == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/market-dashboard-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private
          persist-credentials: false

      - name: Build encrypted portfolio
        if: env.HAS_PRIVATE == 'true'
        env:
          HOLDINGS_FILE: .private/holdings.json
          HOLDINGS_PASSPHRASE: ${{ secrets.HOLDINGS_PASSPHRASE }}
        run: python scripts/build_portfolio.py

      - name: Remove private checkout
        if: always()
        run: rm -rf .private

      - name: Commit data
        run: |
          git config user.name "market-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d %H:%M MYT')"
          git pull --rebase --autostash
          git push
